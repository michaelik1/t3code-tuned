name: Build patched T3 Code

on:
  workflow_dispatch:
    inputs:
      patch_version:
        description: "Optional patch version override (e.g. 3.1). Defaults to patch_version in patch-release.json."
        type: string
        required: false
        default: ""
      verify_only:
        description: Rebuild and verify all desktop targets without publishing a GitHub Release
        type: boolean
        default: false
      repair_draft:
        description: Replace assets of an existing draft release and publish it
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: patched-release
  cancel-in-progress: false

jobs:
  check:
    name: Resolve patch release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      commit: ${{ steps.check.outputs.commit }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            patch-release.json
          sparse-checkout-cone-mode: false

      - name: Resolve release tag and check existing releases
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT_PATCH_VERSION: ${{ inputs.patch_version }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          REPAIR_DRAFT: ${{ inputs.repair_draft }}
        run: |
          set -euo pipefail
          upstream_tag="$(jq -r '.upstream_tag // empty' patch-release.json)"
          [[ "$upstream_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid upstream_tag in patch-release.json: $upstream_tag"; exit 1; }
          patch_version="${INPUT_PATCH_VERSION:-$(jq -r '.patch_version // empty' patch-release.json)}"
          [[ "$patch_version" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "Invalid patch_version: $patch_version"; exit 1; }
          tag="${upstream_tag}-patch.${patch_version}"
          version="${tag#v}"
          commit="$(git rev-parse HEAD)"
          releases="$(gh release list --repo "$REPO" --limit 1000 --json tagName --jq '.[].tagName')"
          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [[ "$VERIFY_ONLY" != "true" && "$REPAIR_DRAFT" != "true" ]] && printf '%s\n' "$releases" | grep -Fxq "$tag"; then
            echo "Release $tag already exists; skipping build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build_bundle:
    name: Build JS bundle & run patch tests
    needs: [check]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.check.outputs.commit }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Verify patch tests
        run: |
          (cd packages/shared && vp test run src/semver.test.ts src/cliRelease.test.ts src/otelEnvironment.test.ts)
          (cd apps/server && vp test run src/skills/SkillLibrary.test.ts src/mcpServers/McpServerTools.test.ts src/speech/SpeechService.test.ts src/mcp/toolkits/orchestrator/usageLimitsPatch.test.ts src/provider/AgentContextBudget.test.ts src/telemetry/AnalyticsService.test.ts src/cloud/publicConfig.test.ts src/cloud/relayTracing.test.ts src/provider/Drivers/CodexHomeLayout.test.ts)
          (cd packages/client-runtime && vp test run src/voice-input/stream.test.ts)

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.check.outputs.version }}"

      - name: Build JS bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: vp run build:desktop:bundle

      # Upload only the expected hidden file, without opting all build outputs into hidden uploads.
      - name: Stage web asset manifest
        shell: bash
        run: |
          manifest=apps/server/dist/client/.vite/manifest.json
          if [[ -f "$manifest" ]]; then
            cp "$manifest" apps/server/dist/client/vite-manifest.release.json
          fi

      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  desktop_mac_arm64:
    name: Desktop macOS arm64
    needs: [check, build_bundle]
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.check.outputs.version }}
      ref: ${{ needs.check.outputs.commit }}
      release_channel: stable
      relay_client_tracing: false
      label: macOS arm64
      runner: macos-26
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: true
      launch_check: true
      save_pnpm_store: false

  desktop_mac_x64:
    name: Desktop macOS x64
    needs: [check, build_bundle]
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.check.outputs.version }}
      ref: ${{ needs.check.outputs.commit }}
      release_channel: stable
      relay_client_tracing: false
      label: macOS x64
      runner: macos-26
      platform: mac
      target: dmg
      arch: x64
      rust_target: x86_64-apple-darwin
      resource_key: darwin-x64
      cli_archive: false

  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [check, build_bundle]
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.check.outputs.version }}
      ref: ${{ needs.check.outputs.commit }}
      release_channel: stable
      relay_client_tracing: false
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      launch_check: true

  desktop_linux_arm64:
    name: Desktop Linux arm64
    needs: [check, build_bundle]
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.check.outputs.version }}
      ref: ${{ needs.check.outputs.commit }}
      release_channel: stable
      relay_client_tracing: false
      label: Linux arm64
      runner: ubuntu-24.04-arm
      platform: linux
      target: AppImage
      arch: arm64
      rust_target: aarch64-unknown-linux-gnu
      resource_key: linux-arm64
      cli_archive: true

  desktop_win_x64:
    name: Desktop Windows x64
    needs: [check, build_bundle]
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.check.outputs.version }}
      ref: ${{ needs.check.outputs.commit }}
      release_channel: stable
      relay_client_tracing: false
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: true

  desktop_win_arm64:
    name: Desktop Windows arm64
    needs: [check, build_bundle]
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.check.outputs.version }}
      ref: ${{ needs.check.outputs.commit }}
      release_channel: stable
      relay_client_tracing: false
      label: Windows arm64
      runner: ubuntu-24.04
      verify_runner: windows-11-arm
      platform: win
      target: nsis
      arch: arm64
      rust_target: aarch64-pc-windows-msvc
      resource_key: win32-arm64
      cli_archive: true

  publish:
    name: Publish GitHub Release
    needs:
      [
        check,
        desktop_mac_arm64,
        desktop_mac_x64,
        desktop_linux_x64,
        desktop_linux_arm64,
        desktop_win_x64,
        desktop_win_arm64,
      ]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.check.outputs.commit }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...

      - name: Download all desktop artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download all CLI archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      - name: Write CLI archive checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          archives=(t3-*.tar.gz t3-*.zip)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "No CLI archives were produced." >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Merge desktop updater manifests
        run: node scripts/merge-release-update-manifests.ts release-assets

      - name: Save verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-desktop-release
          path: release-assets/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Publish release
        if: inputs.verify_only != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
          UPSTREAM_TAG: ${{ needs.check.outputs.upstream_tag }}
          REPAIR_DRAFT: ${{ inputs.repair_draft }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
          )
          if [[ "$REPAIR_DRAFT" == "true" ]]; then
            draft="$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)"
            if [[ "$draft" != "true" ]]; then
              echo "Repair requires an existing draft release." >&2
              exit 1
            fi
            gh release upload "$TAG" "${assets[@]}" --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --draft=false --latest
          else
            sed "s/{{UPSTREAM_TAG}}/${UPSTREAM_TAG}/g" RELEASE_NOTES.md > "$RUNNER_TEMP/release-notes.md"
            gh release create "$TAG" "${assets[@]}" --repo "$REPO" --title "Patched T3 Code $TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi
